name: Wrapper contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bash syntax
        run: bash -n scripts/action.sh
      - name: Python standard-library tests (offline)
        run: python3 -B -m unittest discover -s tests -v
